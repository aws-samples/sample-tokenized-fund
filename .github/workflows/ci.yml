name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundry-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        working-directory: synthetic-asset-minter
        run: forge install

      - name: Build contracts
        working-directory: synthetic-asset-minter
        run: forge build

      - name: Run tests
        working-directory: synthetic-asset-minter
        run: forge test -vvv

  lambda-tests:
    name: Lambda Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sample-cre-pricefeeds-por/price-feed-por-dynamodb-crud/package-lock.json

      - name: Install dependencies
        working-directory: sample-cre-pricefeeds-por/price-feed-por-dynamodb-crud
        run: npm ci

      - name: Run tests
        working-directory: sample-cre-pricefeeds-por/price-feed-por-dynamodb-crud
        run: npm test

  cre-workflow-build:
    name: CRE Workflow Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: sample-cre-pricefeeds-por/aws-oracle-cre/go.sum

      - name: Build workflow
        working-directory: sample-cre-pricefeeds-por/aws-oracle-cre
        run: |
          go mod download
          cd api-oracle && go build ./...
